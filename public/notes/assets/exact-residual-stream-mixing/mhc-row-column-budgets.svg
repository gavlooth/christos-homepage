<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"><title>Rows and columns make different promises</title><desc>Rows form weighted averages of inputs. Columns preserve each input’s total contribution across outputs.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#6b8a91"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#173348;font-size:17px}.label{font-weight:700;font-size:20px}.small{font-size:15px;fill:#506a73}.wire{stroke:#6b8a91;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="900" height="360" rx="12" fill="#fff"/><text x="40" y="42" class="label">One feature: (10, 20, 30) → (15, 21, 24)</text><rect x="50" y="85" width="100" height="58" rx="5" fill="#d9eeea"/><text x="100" y="122" text-anchor="middle">0.6</text><rect x="155" y="85" width="100" height="58" rx="5" fill="#d9eeea"/><text x="205" y="122" text-anchor="middle">0.3</text><rect x="260" y="85" width="100" height="58" rx="5" fill="#d9eeea"/><text x="310" y="122" text-anchor="middle">0.1</text><text x="385" y="122">row sum = 1</text><rect x="50" y="148" width="100" height="58" rx="5" fill="#f1f4f2"/><text x="100" y="185" text-anchor="middle">0.2</text><rect x="155" y="148" width="100" height="58" rx="5" fill="#f1f4f2"/><text x="205" y="185" text-anchor="middle">0.5</text><rect x="260" y="148" width="100" height="58" rx="5" fill="#f1f4f2"/><text x="310" y="185" text-anchor="middle">0.3</text><text x="385" y="185">row sum = 1</text><rect x="50" y="211" width="100" height="58" rx="5" fill="#f1f4f2"/><text x="100" y="248" text-anchor="middle">0.2</text><rect x="155" y="211" width="100" height="58" rx="5" fill="#f1f4f2"/><text x="205" y="248" text-anchor="middle">0.2</text><rect x="260" y="211" width="100" height="58" rx="5" fill="#f1f4f2"/><text x="310" y="248" text-anchor="middle">0.6</text><text x="385" y="248">row sum = 1</text><text x="50" y="305">Each column also sums to 1.</text><rect x="565" y="100" width="305" height="125" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="717.5" y="129" text-anchor="middle">Two checks</text><text x="717.5" y="157" text-anchor="middle">Rows: each output averages.</text><text x="717.5" y="180" text-anchor="middle">Columns: each input has</text><text x="717.5" y="203" text-anchor="middle">total outgoing weight one.</text></svg>
