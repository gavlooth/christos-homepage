<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img"><title>The direct parameterization</title><desc>Unconstrained parameters form a skew matrix, then an orthogonal matrix, then block energies of a stochastic mixer.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#6b8a91"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#173348;font-size:17px}.label{font-weight:700;font-size:20px}.small{font-size:15px;fill:#506a73}.wire{stroke:#6b8a91;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="900" height="260" rx="12" fill="#fff"/><rect x="20" y="75" width="185" height="120" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="112.5" y="104" text-anchor="middle">Parameters</text><text x="112.5" y="132" text-anchor="middle">Learned coordinates</text><rect x="245" y="75" width="185" height="120" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="337.5" y="104" text-anchor="middle">Skew matrix</text><text x="337.5" y="132" text-anchor="middle">Aᵀ = −A</text><text x="337.5" y="155" text-anchor="middle">Size ds × ds</text><rect x="470" y="75" width="185" height="120" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="562.5" y="104" text-anchor="middle">Orthogonal Q</text><text x="562.5" y="132" text-anchor="middle">Cayley transform</text><text x="562.5" y="155" text-anchor="middle">QᵀQ = I</text><rect x="695" y="75" width="185" height="120" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="787.5" y="104" text-anchor="middle">Routing B</text><text x="787.5" y="132" text-anchor="middle">Block energies / s</text><text x="787.5" y="155" text-anchor="middle">Size d × d</text><path class="wire" d="M205 135 H245"/><path class="wire" d="M430 135 H470"/><path class="wire" d="M655 135 H695"/><text x="450" y="35" text-anchor="middle" class="label">The internal size grows; the number of streams does not.</text></svg>
