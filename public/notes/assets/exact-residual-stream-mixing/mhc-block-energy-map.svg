<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img"><title>Six internal coordinates make three streams</title><desc>For d equals three and block size two, a six by six orthogonal matrix is divided into nine two by two blocks.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#6b8a91"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#173348;font-size:17px}.label{font-weight:700;font-size:20px}.small{font-size:15px;fill:#506a73}.wire{stroke:#6b8a91;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="900" height="370" rx="12" fill="#fff"/><text class="label" x="185" y="35" text-anchor="middle">Q: 6 × 6</text><text class="label" x="675" y="35" text-anchor="middle">B: 3 × 3</text><rect x="50" y="65" width="44" height="44" fill="#d9eeea" stroke="#fff"/><rect x="95" y="65" width="44" height="44" fill="#d9eeea" stroke="#fff"/><rect x="140" y="65" width="44" height="44" fill="#e7ecf4" stroke="#fff"/><rect x="185" y="65" width="44" height="44" fill="#e7ecf4" stroke="#fff"/><rect x="230" y="65" width="44" height="44" fill="#f4e7da" stroke="#fff"/><rect x="275" y="65" width="44" height="44" fill="#f4e7da" stroke="#fff"/><rect x="50" y="110" width="44" height="44" fill="#d9eeea" stroke="#fff"/><rect x="95" y="110" width="44" height="44" fill="#d9eeea" stroke="#fff"/><rect x="140" y="110" width="44" height="44" fill="#e7ecf4" stroke="#fff"/><rect x="185" y="110" width="44" height="44" fill="#e7ecf4" stroke="#fff"/><rect x="230" y="110" width="44" height="44" fill="#f4e7da" stroke="#fff"/><rect x="275" y="110" width="44" height="44" fill="#f4e7da" stroke="#fff"/><rect x="50" y="155" width="44" height="44" fill="#e7ecf4" stroke="#fff"/><rect x="95" y="155" width="44" height="44" fill="#e7ecf4" stroke="#fff"/><rect x="140" y="155" width="44" height="44" fill="#f4e7da" stroke="#fff"/><rect x="185" y="155" width="44" height="44" fill="#f4e7da" stro