<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"><title>Two paths through a Hyper-Connection</title><desc>Residual routing is added to a branch that reads streams, transforms features, and writes back.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#6b8a91"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#173348;font-size:17px}.label{font-weight:700;font-size:20px}.small{font-size:15px;fill:#506a73}.wire{stroke:#6b8a91;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="900" height="350" rx="12" fill="#fff"/><rect x="20" y="40" width="190" height="90" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="115.0" y="69" text-anchor="middle">Input streams</text><text x="115.0" y="97" text-anchor="middle">X: d × D</text><rect x="320" y="40" width="220" height="90" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="430.0" y="69" text-anchor="middle">Residual routing</text><text x="430.0" y="97" text-anchor="middle">Hres X: d × D</text><rect x="680" y="40" width="200" height="90" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="780.0" y="69" text-anchor="middle">Next streams</text><text x="780.0" y="97" text-anchor="middle">Sum both paths</text><path class="wire" d="M210 85 H320"/><path class="wire" d="M540 85 H680"/><rect x="50" y="215" width="210" height="95" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="155.0" y="244" text-anchor="middle">Read</text><text x="155.0" y="272" text-anchor="middle">Hpre X: 1 × D</text><rect x="340" y="215" width="190" height="95" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="435.0" y="244" text-anchor="middle">Transform</text><text x="435.0" y="272" text-anchor="middle">F: 1 × D</text><rect x="610" y="215" width="240" height="95" rx="9" fill="#eaf4f1" stroke="#b9cec8"/><text class="label" x="730.0" y="244" text-anchor="middle">Write back</text><text x="730.0" y="272" text-anchor="middle">Hpostᵀ F: d × D</text><path class="wire" d="M115 130 V215"/><path class="wire" d="M260 262 H340"/><path class="wire" d="M530 262 H610"/><path class="wire" d="M780 215 V130"/></svg>
