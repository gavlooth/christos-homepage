<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of host-defect objects</title>
  <desc id="desc">Two panels showing: (left) Cr substitution in corundum, and (right) SiC divacancy in silicon carbide.</desc>
  <defs>
    <style>
      .panel { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; }
      .host-Al { fill:#315a88; }
      .host-O { fill:#a0aec0; }
      .host-Si { fill:#315a88; }
      .host-C { fill:#64748b; }
      .impurity { fill:#f59e0b; }
      .vacancy { fill:none; stroke:#c2413b; stroke-width:4; stroke-dasharray:4 2; }
      .bond { stroke:#475569; stroke-width:2; }
      .label { font:bold 22px sans-serif; fill:#0f172a; }
      .sub { font:18px sans-serif; fill:#475569; }
      .legend-text { font:16px sans-serif; fill:#0f172a; }
    </style>
  </defs>
  <rect width="1400" height="720" fill="#ffffff"/>
  
  <!-- Left Panel: Cr in Corundum -->
  <g transform="translate(50, 100)">
    <rect class="panel" width="620" height="520" rx="14"/>
    <text x="310" y="40" text-anchor="middle" class="label">Substitution: Cr<tspan baseline-shift="super" font-size="14">3+</tspan> in Corundum</text>
    <text x="310" y="65" text-anchor="middle" class="sub">Ruby as dilute chromium in corundum</text>
    
    <!-- Cr + 6O + Al -->
    <g transform="translate(310, 250)">
      <circle cx="0" cy="0" r="25" class="impurity"/> <!-- Cr -->
      <text x="30" y="5" class="legend-text">Cr</text>
      <!-- 6 Oxygens -->
      <circle cx="0" cy="-60" r="15" class="host-O"/><circle cx="52" cy="-30" r="15" class="host-O"/>
      <circle cx="52" cy="30" r="15" class="host-O"/><circle cx="0" cy="60" r="15" class="host-O"/>
      <circle cx="-52" cy="30" r="15" class="host-O"/><circle cx="-52" cy="-30" r="15" class="host-O"/>
      <line x1="0" y1="0" x2="0" y2="-45" class="bond"/>
      <!-- Al hosts -->
      <circle cx="-100" cy="0" r="20" class="host-Al"/><text x="-140" y="5" class="legend-text">Al</text>
      <circle cx="100" cy="0" r="20" class="host-Al"/>
    </g>
  </g>
  
  <!-- Right Panel: SiC Divacancy -->
  <g transform="translate(730, 100)">
    <rect class="panel" width="620" height="520" rx="14"/>
    <text x="310" y="40" text-anchor="middle" class="label">Divacancy: SiC in Silicon Carbide</text>
    <text x="310" y="65" text-anchor="middle" class="sub">Adjacent missing silicon and carbon sites</text>
    
    <g transform="translate(200, 250)">
      <circle cx="0" cy="0" r="20" class="host-Si"/><text x="-10" y="-30" class="legend-text">Si</text>
      <circle cx="80" cy="0" r="20" class="host-C"/><text x="70" y="-30" class="legend-text">C</text>
      <!-- Divacancy -->
      <rect x="160" y="-20" width="40" height="40" class="vacancy"/><text x="160" y="-30" class="legend-text">V_Si</text>
      <rect x="240" y="-20" width="40" height="40" class="vacancy"/><text x="240" y="-30" class="legend-text">V_C</text>
      <line x1="20" y1="0" x2="60" y2="0" class="bond"/>
    </g>
  </g>
</svg>
