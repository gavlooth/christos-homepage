<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Lattice and Motif Schematic</title>
  <desc id="desc">Two-panel schematic showing a bare lattice with primitive unit cell and translation vectors on the left, and a motif of two atoms at each lattice point on the right.</desc>
  <defs>
    <style>
      .panel { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; }
      .lattice-point { fill:#315a88; }
      .unit-cell { fill:none; stroke:#315a88; stroke-width:3; stroke-dasharray:8 4; }
      .vector { stroke:#15807c; stroke-width:4; marker-end:url(#arrowhead); }
      .atom { fill:#315a88; }
      .motif-atom-2 { fill:#15807c; }
      .label { font:bold 22px sans-serif; fill:#0f172a; }
      .sub { font:18px sans-serif; fill:#475569; }
      .legend-text { font:16px sans-serif; fill:#0f172a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15807c"/>
    </marker>
  </defs>
  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" class="label">2D Lattice Schematic</text>

  <!-- Legend -->
  <g transform="translate(50, 650)">
    <circle cx="10" cy="-5" r="8" class="lattice-point"/>
    <text x="25" y="0" class="legend-text">Lattice point</text>
    <circle cx="150" cy="-5" r="8" class="atom"/>
    <text x="165" y="0" class="legend-text">Motif atom A</text>
    <circle cx="300" cy="-5" r="8" class="motif-atom-2"/>
    <text x="315" y="0" class="legend-text">Motif atom B</text>
  </g>

  <!-- Panel 1: Bare Lattice -->
  <g transform="translate(50, 100)">
    <rect class="panel" width="620" height="500" rx="14"/>
    <text x="310" y="40" text-anchor="middle" class="label">Bare Lattice</text>
    <g transform="translate(160, 150)">
      <rect x="0" y="0" width="300" height="200" class="unit-cell"/>
      <line x1="0" y1="0" x2="300" y2="0" class="vector"/>
      <line x1="0" y1="0" x2="0" y2="200" class="vector"/>
      <text x="150" y="-10" text-anchor="middle" class="label">a<tspan baseline-shift="sub" font-size="16">1</tspan></text>
      <text x="-20" y="100" text-anchor="middle" class="label">a<tspan baseline-shift="sub" font-size="16">2</tspan></text>
      <g>
        <circle cx="0" cy="0" r="8" class="lattice-point"/>
        <circle cx="300" cy="0" r="8" class="lattice-point"/>
        <circle cx="0" cy="200" r="8" class="lattice-point"/>
        <circle cx="300" cy="200" r="8" class="lattice-point"/>
      </g>
    </g>
  </g>

  <!-- Panel 2: Lattice with Motif -->
  <g transform="translate(730, 100)">
    <rect class="panel" width="620" height="500" rx="14"/>
    <text x="310" y="40" text-anchor="middle" class="label">Lattice with Motif</text>
    <g transform="translate(160, 150)">
      <g>
        <circle cx="0" cy="0" r="8" class="atom"/><circle cx="20" cy="20" r="8" class="motif-atom-2"/>
        <circle cx="300" cy="0" r="8" class="atom"/><circle cx="320" cy="20" r="8" class="motif-atom-2"/>
        <circle cx="0" cy="200" r="8" class="atom"/><circle cx="20" cy="220" r="8" class="motif-atom-2"/>
        <circle cx="300" cy="200" r="8" class="atom"/><circle cx="320" cy="220" r="8" class="motif-atom-2"/>
      </g>
    </g>
  </g>
</svg>
