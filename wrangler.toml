name = 'christos'
compatibility_date = "2026-03-12"
# The site builder writes every deployable asset to public/.  Publishing the
# repository root makes these files live under /public/ in a Pages deployment,
# so notebook URLs such as /notes/fibonacci-quasicrystals.html cannot resolve.
pages_build_output_dir = "public"

 
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
